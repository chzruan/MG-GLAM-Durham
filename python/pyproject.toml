[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glamio"
dynamic = ["version"]          # single source: glamio.__version__
description = "Readers for GLAM / MG-GLAM simulation outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}
authors = [{name = "Cheng-Zong Ruan"}]

[project.optional-dependencies]
test = ["pytest"]
hdf5 = ["h5py>=3.0"]           # packed runs (glamio.pack, glamio.packed); native files need numpy only

[tool.setuptools.dynamic]
version = {attr = "glamio.__version__"}

[tool.setuptools.packages.find]
include = ["glamio*"]
